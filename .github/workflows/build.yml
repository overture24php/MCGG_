name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  mcggmod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ambil frida-gum devkit (android-arm64)
        run: |
          set -euxo pipefail
          VER="16.5.9"
          URL="https://github.com/frida/frida/releases/download/${VER}/frida-gum-devkit-${VER}-android-arm64.tar.xz"
          mkdir -p third_party/frida-gum
          curl -fL --retry 3 -o gum.tar.xz "$URL"
          tar -xJf gum.tar.xz -C third_party/frida-gum
          ls -la third_party/frida-gum

      - name: Konfigurasi CMake (NDK bawaan runner)
        run: |
          set -euxo pipefail
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -GNinja

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Salin sebagai .sh (pola libTool)
        run: cp build/libmcggmod.so build/mcggmod_inject.sh

      - uses: actions/upload-artifact@v4
        with:
          name: libmcggmod-arm64
          path: |
            build/libmcggmod.so
            build/mcggmod_inject.sh
          if-no-files-found: error

  modmenu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: main

      - name: Checkout ImGui
        uses: actions/checkout@v4
        with:
          repository: ocornut/imgui
          path: imgui
          ref: v1.91.0

      - name: Siapkan folder android-modmenu
        run: |
          set -euxo pipefail
          cd main/android-modmenu
          # copy ImGui headers + sources
          mkdir -p include/imgui/backends
          cp ../../imgui/imgui.cpp ../../imgui/imgui_demo.cpp ../../imgui/imgui_draw.cpp \
             ../../imgui/imgui_tables.cpp ../../imgui/imgui_widgets.cpp include/imgui/
          cp ../../imgui/imgui.h ../../imgui/imgui_internal.h include/imgui/
          cp ../../imgui/imconfig.h ../../imgui/imstb_rectpack.h ../../imgui/imstb_textedit.h \
             ../../imgui/imstb_truetype.h include/imgui/
          cp ../../imgui/backends/imgui_impl_android.cpp \
             ../../imgui/backends/imgui_impl_android.h \
             ../../imgui/backends/imgui_impl_opengl3.cpp \
             ../../imgui/backends/imgui_impl_opengl3.h \
             ../../imgui/backends/imgui_impl_opengl3_loader.h \
             include/imgui/backends/
          ls -la include/imgui/

      - name: Build arm64-v8a
        run: |
          set -euxo pipefail
          cd main/android-modmenu
          mkdir -p build/arm64-v8a
          cd build/arm64-v8a
          cmake ../.. \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)

      - name: Salin sebagai .sh
        run: |
          cp main/android-modmenu/build/arm64-v8a/libmcgg_mod_menu.so \
             main/android-modmenu/build/arm64-v8a/mcgg_mod_menu_inject.sh

      - uses: actions/upload-artifact@v4
        with:
          name: mcgg-modmenu-arm64
          path: |
            main/android-modmenu/build/arm64-v8a/libmcgg_mod_menu.so
            main/android-modmenu/build/arm64-v8a/mcgg_mod_menu_inject.sh
          if-no-files-found: error

  zygisk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: main

      - name: Build Zygisk loader
        run: |
          set -euxo pipefail
          cd main/mcgg-zygisk-module
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)

      - name: Package module
        run: |
          set -euxo pipefail
          cd main/mcgg-zygisk-module
          mkdir -p out/zygisk
          cp build/libmcgg-zygisk.so out/zygisk/arm64-v8a.so 2>/dev/null || \
          cp build/libmcggzygisk.so out/zygisk/arm64-v8a.so 2>/dev/null || \
          echo "Zygisk build skipped (optional)"

      - uses: actions/upload-artifact@v4
        with:
          name: mcgg-zygisk-module
          path: main/mcgg-zygisk-module/out/
          if-no-files-found: warn
